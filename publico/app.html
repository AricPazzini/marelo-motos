<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marelo Motos — Sistema de Gestão</title>
<link rel="stylesheet" href="./css/estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23FECC4D'/><text y='23' x='7' font-size='18' font-family='sans-serif' font-weight='bold'>M</text></svg>">
</head>
<body>

<div class="layout">

  <aside class="sidebar">
    <div class="marca-side">Marelo Motos</div>

    <div class="usuario">
      <div class="avatar" id="avatar">👤</div>
      <div>
        <div class="nome" id="usuario-nome">—</div>
        <div class="funcao" id="usuario-funcao">—</div>
      </div>
    </div>

    <div class="divisor"></div>

    <nav class="menu" id="menu" aria-label="Módulos do sistema"></nav>

    <div class="rodape-side">
      <button id="botao-sair">Sair do sistema</button>
    </div>
  </aside>

  <main class="conteudo">
    <header class="topo">
      <div class="modulo" id="modulo-atual">Carregando…</div>
      <div class="acoes">
        <span class="pilula" id="pilula-perfil">—</span>
        <span class="pilula cinza" id="pilula-loja">—</span>
      </div>
    </header>

    <div class="abas oculto" id="abas"></div>

    <div class="pagina" id="pagina">
      <div class="carregando">Carregando o sistema…</div>
    </div>

    <footer class="faixa">
      <span>
        <b>Protótipo funcional</b> — Projeto Integrador em ADS II · FATEC ·
        Aric Proença Pazzini e Lucas Belfort Darantes Medeiros
      </span>
      <span id="rodape-banco">Dados fictícios, a confirmar na visita à loja</span>
    </footer>
  </main>

</div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
